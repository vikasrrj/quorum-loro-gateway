[package]
name = "quorum-loro-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Stateless Loro protocol gateway backed by Ursula durable streams"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures-util = "0.3"
loro = "=1.13.7"
loro-protocol = "=0.3.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.27"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
